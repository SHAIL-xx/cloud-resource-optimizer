name: Weekly Cloud Resource Audit

on:
  schedule:
    - cron: '0 8 * * 1' # Runs Monday at 1:30 PM IST
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    
    # This spins up LocalStack right inside GitHub Actions!
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
          - 4571:4571

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provision Mock Data in CI
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          USE_LOCAL_EMULATOR: "True"
        run: python setup_mock_data.py

      - name: Run Optimization Audit (Dry Run)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          USE_LOCAL_EMULATOR: "True"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py