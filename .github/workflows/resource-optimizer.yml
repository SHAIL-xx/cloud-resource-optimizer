name: Weekly Cloud Resource Audit

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & LocalStack CLI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install localstack

      - name: Start LocalStack via Official CLI
        run: |
          # The CLI automatically pulls the image, configures ports, and starts it in the background
          localstack start -d
          
          echo "Waiting for LocalStack to be fully ready..."
          # The CLI's native wait command is bulletproof
          localstack wait -t 120
          
          echo "LocalStack is up and running!"

      - name: Provision Mock Data in CI
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-south-1
          USE_LOCAL_EMULATOR: "True"
          LOCALSTACK_ENDPOINT: "http://127.0.0.1:4566"
        run: python setup_mock_data.py

      - name: Run Optimization Audit (Dry Run)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-south-1
          USE_LOCAL_EMULATOR: "True"
          LOCALSTACK_ENDPOINT: "http://127.0.0.1:4566"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py