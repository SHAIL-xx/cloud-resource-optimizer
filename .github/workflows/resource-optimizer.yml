name: Weekly Cloud Resource Audit

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start LocalStack Emulator
        run: |
          docker run -d -p 4566:4566 localstack/localstack:latest
          echo "Waiting for LocalStack to be ready..."
          timeout 60 bash -c 'until curl -s http://localhost:4566/_localstack/health | grep -q "\"initScripts\": \"initialized\""; do sleep 2; done'
          echo "LocalStack is up and running!"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provision Mock Data in CI
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          USE_LOCAL_EMULATOR: "True"
          LOCALSTACK_ENDPOINT: "http://localhost:4566"
        run: python setup_mock_data.py

      - name: Run Optimization Audit (Dry Run)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          USE_LOCAL_EMULATOR: "True"
          LOCALSTACK_ENDPOINT: "http://localhost:4566"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py